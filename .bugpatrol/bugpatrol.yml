# Generated by the global bug-patrol skill. SAFE DEFAULTS — do not turn them off.
# fixer OFF + github OFF = Bugpatrol may look and report, never edit or post.
version: 1

app:
  platform: web
  source: .
  setup:
    - run: npm run dev
      cwd: .
      background: true
      readyWhen: 'localhost:5182'
      timeoutMs: 180000
  connect: { url: http://localhost:5182 }
  instructions: .bugpatrol/instructions.md
  secrets: []

run:
  command: npm run dev
  url: http://localhost:5182
  ready:
    timeoutMs: 180000

agents:
  explorer:
    maxSteps: 150
    budgetUsd: 3
    use: { runtime: model, via: openrouter, model: z-ai/glm-5.3-flash }
  judge:
    use: { runtime: model, via: openrouter, model: anthropic/claude-haiku-5.5 }
  fixer:
    enabled: false
  github:
    enabled: false
  memory:
    enabled: true
  patrol:
    intervalMinutes: 30
    cycles: 1
    pull: false
