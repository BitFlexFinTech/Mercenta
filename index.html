<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts (Lovable Concept 3 + Mercenta) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Geist+Mono:wght@400..700&family=Geist:wght@300..800&family=Schibsted+Grotesk:wght@400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap" />

    <!-- ── BOOTSTRAP METADATA — BOOTSTRAP ONLY ──────────────────────────────
         §B7 (2026-09-29). Every value below is the SAME one the route SSOT
         declares for "/" (`src/lib/seo/publicRoutes.ts` → PUBLIC_ROUTE_BY_PAGE.home),
         and `scripts/validate-seo-foundation.mjs` FAILS if the two drift apart.
         The runtime route-metadata layer overwrites title, description,
         canonical, robots and og:url for every route.

         WHAT WAS WRONG. The description was the positioning B3 RETIRED, and
         `PUBLIC_CATEGORY` ("Retail channel partner") contradicts it. It is now the
         public-copy owner's own one-sentence promise, so the homepage's search
         description and its hero cannot describe the business two different ways.
    -->
    <meta
      name="description"
      content="Mercenta Partners operates a dedicated UK retail vendor infrastructure — acquiring inventory, managing vendor operations, brand registration, product content, pricing governance and replenishment. We plug in talent IP, international brands and emerging-market producers directly into UK retail. One commercial agreement. Zero operational overhead."
    />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical URL — BOOTSTRAP ONLY. The runtime route-metadata layer
         (`src/lib/seo/publicRoutes.ts` + `src/lib/seo/routeMetadata.ts`, mounted
         by `RouteMetadata`) rewrites this element per route, and REMOVES it on a
         private/unknown path. Never add a second canonical link. -->
    <link rel="canonical" href="https://mercenta.co.uk/" id="route-canonical" />

    <!-- Open Graph — §B7: the SAME description as the SSOT home description and
         the SAME title. One page, one description; never a second wording of it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mercenta Partners" />
    <meta property="og:title" content="Mercenta Partners" />
    <meta
      property="og:description"
      content="Mercenta Partners operates a dedicated UK retail vendor infrastructure — acquiring inventory, managing vendor operations, brand registration, product content, pricing governance and replenishment. We plug in talent IP, international brands and emerging-market producers directly into UK retail. One commercial agreement. Zero operational overhead."
    />
    <meta property="og:url" content="https://mercenta.co.uk/" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter Card / Summary Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mercenta Partners" />
    <meta
      name="twitter:description"
      content="Mercenta Partners operates a dedicated UK retail vendor infrastructure — acquiring inventory, managing vendor operations, brand registration, product content, pricing governance and replenishment. We plug in talent IP, international brands and emerging-market producers directly into UK retail. One commercial agreement. Zero operational overhead."
    />

    <!-- Open Graph image -->
    <meta property="og:image" content="https://mercenta.co.uk/apple-touch-icon.png" />
    <meta property="og:image:width" content="180" />
    <meta property="og:image:height" content="180" />
    <meta name="twitter:image" content="https://mercenta.co.uk/apple-touch-icon.png" />
    <meta name="theme-color" content="#0C1219" />


    <!-- Font loading — parallel preconnect + stylesheet replaces render-blocking @import in CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      media="print" onload="this.media='all'" />
    <!-- Fallback for browsers without JavaScript/onload support -->
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" /></noscript>

    <!-- Static bootstrap title: main.tsx overrides this with BRAND_NAME at runtime. -->
    <title>Mercenta Partners</title>

    <!-- ── JSON-LD — REWRITTEN IN B7 (2026-09-29) ────────────────────────────
         WHAT WAS WRONG. These blocks are read by every search engine and AI
         crawler that consumes structured data, and they published the regulated
         position, the commercial model, an internal feature inventory (naming the
         carrier monitor and the supplier set), the supplier names themselves, and
         a permissions line naming the carrier environment Phase P9 removed.

         NOW. Each node states only what the platform can evidence in public: who
         it is, where it operates, the one honest page description and a contact
         address that exists. The SoftwareApplication node is GONE rather than
         restated — an internal feature inventory is not a public fact (REMOVE
         before ADD). `scripts/validate-seo-foundation.mjs` pins EVERY description
         in this file to the SSOT home description, and
         `scripts/validate-public-claims.mjs` scans this file for the declared
         red lines, because a comment in a SHIPPED file is published too.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Mercenta Partners",
      "legalName": "Mercenta Partners Ltd",
      "url": "https://mercenta.co.uk/",
      "description": "Mercenta Partners operates a dedicated UK retail vendor infrastructure — acquiring inventory, managing vendor operations, brand registration, product content, pricing governance and replenishment. We plug in talent IP, international brands and emerging-market producers directly into UK retail. One commercial agreement. Zero operational overhead.",
      "areaServed": [
        { "@type": "Country", "name": "United Kingdom" }
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@mercenta.co.uk",
        "contactType": "customer enquiries"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Mercenta Partners",
      "url": "https://mercenta.co.uk/",
      "description": "Mercenta Partners operates a dedicated UK retail vendor infrastructure — acquiring inventory, managing vendor operations, brand registration, product content, pricing governance and replenishment. We plug in talent IP, international brands and emerging-market producers directly into UK retail. One commercial agreement. Zero operational overhead."
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Mercenta Partners — Home",
      "url": "https://mercenta.co.uk/",
      "inLanguage": "en-GB",
      "description": "Mercenta Partners operates a dedicated UK retail vendor infrastructure — acquiring inventory, managing vendor operations, brand registration, product content, pricing governance and replenishment. We plug in talent IP, international brands and emerging-market producers directly into UK retail. One commercial agreement. Zero operational overhead.",
      "isPartOf": {
        "@type": "WebSite",
        "url": "https://mercenta.co.uk/"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      §B7 (2026-09-29) — A NOTICE, NOT A SECOND COPY OF THE SITE.

      This block used to contain the ENTIRE pre-B3 public site: the retired
      positioning, the regulated position and its registrations, the commercial
      model and its arithmetic, another company's rules and vocabulary, the
      companies carriage is bought from, an invented sourcing-corridor claim, the
      internal portal inventory, and a stale duplicate of BOTH legal documents
      dated 30 August 2026 — every one of the claims
      `src/config/positioning.ts` §11 declares a public surface may never make.

      It was invisible to every gate: the browser checks render with JavaScript
      on (so `<noscript>` is never seen), and `validate:wording` scans `src/` only.
      What remains is the one thing a visitor without JavaScript actually needs.
      The site's real copy lives in its owners (`src/config/positioning.ts`) and
      is never forked here — and this block is now scanned like any other public
      copy (`scripts/validate-public-claims.mjs`).
    -->
    <noscript>
      <div style="padding: 2rem; max-width: 720px; margin: 0 auto; font-family: sans-serif; line-height: 1.6;">
        <h1>Mercenta Partners</h1>
        <p>This site needs JavaScript to run. Please enable JavaScript in your browser, then reload the page.</p>
        <p>You can reach us at <a href="mailto:hello@mercenta.co.uk">hello@mercenta.co.uk</a>.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
