      <div style="padding: 2rem; max-width: 720px; margin: 0 auto; font-family: sans-serif;">
        <h1>Mercenta Partners</h1>
        <p>Self-service wholesale distribution platform connecting independent brands with UK retail channels.</p>

        <h2>How Mercenta Works</h2>
        <p>Your brand. The UK market. No infrastructure required. Mercenta Partners is a self-service platform that gets independent brands into the UK market. You onboard yourself, manage your catalogue, and track every order in real-time. Mercenta handles distribution, UK customs clearance, and retail channel placement.</p>
        <ul>
          <li>Onboard your brand &mdash; Submit products and compliance documents. Self-service, no waiting.</li>
          <li>We distribute &mdash; Your products go live across UK retail channels with full logistics handled.</li>
          <li>You manage from your portal &mdash; Acknowledge orders, track shipments, monitor performance. Real-time.</li>
        </ul>

        <h2>Services</h2>
        <ul>
          <li><strong>Every Order in Real-Time</strong> &mdash; See every order the moment it is placed. No monthly reports.</li>
          <li><strong>Live Shipment Tracking</strong> &mdash; Track every shipment from origin to delivery.</li>
          <li><strong>UK-Based Distribution</strong> &mdash; UK distribution for independent brands across health, home, kitchen, and consumer categories.</li>
          <li><strong>Automated Order-to-Fulfilment</strong> &mdash; Full order-to-fulfilment cycle automation for UK market access.</li>
        </ul>

        <h2>Global Sourcing Routes</h2>
        <ul>
          <li><strong>North America</strong> &mdash; US brands enter through trade corridors into UK retail channels.</li>
          <li><strong>Europe</strong> &mdash; EU brands by road freight into UK distribution with compliance handled.</li>
          <li><strong>Africa</strong> &mdash; African brands through depot network into UK retail channels.</li>
        </ul>

        <h2>User Roles</h2>
        <ul>
          <li><strong>Brand Partner</strong> &mdash; Brands distributing through Mercenta's UK retail network. Manage products, catalogue, purchase orders, shipments, compliance, contracts, returns, analytics, reports, team messages, social accounts, settings.</li>
          <li><strong>Mercenta Admin</strong> &mdash; Internal operations. Manage brand CRM, fulfillment track, retail pipeline, purchase orders, logistics, carriers, catalog, compliance, billing, contracts, communications, helpdesk, returns, monitoring, marketing.</li>
          <li><strong>Super Admin</strong> &mdash; Full platform access: staff management, audit log, integration settings, system admin.</li>
          <li><strong>3PL Carrier</strong> &mdash; DHL, FedEx, BAK Logistics manifest management and tracking portal.</li>
        </ul>

        <h2>Brand Portal Sections</h2>
        <p>Dashboard, Onboarding &amp; Legal, Contracts, Purchase Orders, Product Catalog, Inbound Shipments, UK Compliance, Returns, Analytics, Reports, Documents &amp; Account, Support &amp; Team, Social Accounts, Settings.</p>

        <h2>Admin Portal Sections</h2>
        <p>Brand CRM, Fulfillment Track, Retail Pipeline, Purchase Orders (Admin), Logistics Control, Carrier Integration Monitor, Global Catalog Manager, Compliance Approvals, Billing, Contract Cycle, Communications, Helpdesk, Returns Tracking, Monitoring, Marketing, Super Admin Panel, Audit Log, Integration Settings.</p>

        <h2>Privacy Policy</h2>
        <p>Last updated: 30 August 2026. Mercenta Partners Ltd complies with UK GDPR and the Data Protection Act 2018.</p>
        <h3>1. Who we are</h3>
        <p>Mercenta Partners Ltd, a UK wholesale distribution platform. Contact: privacy@mercenta.co.uk</p>
        <h3>2. What we collect</h3>
        <p>Identity (name, job title, company), Contact (business email, phone, address), Financial (bank details, VAT/EORI), Transaction (PO history, shipments, compliance docs), Communications (messages, tickets), Technical (IP, browser, login timestamps).</p>
        <h3>3. Legal basis</h3>
        <p>Contract performance (orders, shipments, payments), legitimate interests (CRM, fraud prevention), legal obligation (tax, customs), consent (marketing, opt-in only).</p>
        <h3>4. Data sharing</h3>
        <p>Shared with fulfilment partners, Stripe, carriers, regulators. Never sold.</p>
        <h3>5. Retention</h3>
        <p>Business relationship plus six years (HMRC), then deleted or anonymised.</p>
        <h3>6. Your rights</h3>
        <p>Access, rectify, erase, restrict, port, withdraw consent. Email privacy@mercenta.co.uk</p>
        <h3>7. Contact</h3>
        <p>privacy@mercenta.co.uk. Regulator: ICO, ico.org.uk</p>

        <h2>Terms of Service</h2>
        <p>Last updated: 30 August 2026</p>
        <h3>1. Acceptance</h3>
        <p>By using the Mercenta Partners Ltd platform, you agree to these Terms.</p>
        <h3>2. Definitions</h3>
        <p>Platform: Mercenta wholesale distribution system. Brand: product supplier. Retail Network: UK fulfilment partners. PO: purchase order.</p>
        <h3>3. Brand obligations</h3>
        <p>Accurate product info and compliance docs. Acknowledge POs within 24 hours. Fulfil accepted POs. Notify changes.</p>
        <h3>4. Platform fees</h3>
        <p>Commission per PO fulfilled plus logistics and service fees. Deducted from remittance.</p>
        <h3>5. Payment terms</h3>
        <p>Per commercial agreement schedule, subject to PO verification and delivery confirmation.</p>
        <h3>6. Compliance</h3>
        <p>Brands ensure UK regulation compliance (UKCA/CE, REACH, GPSR). Non-compliant products may be suspended.</p>
        <h3>7. Liability</h3>
        <p>Liability limited to fees paid in preceding 12 months. No liability for indirect losses.</p>
        <h3>8. Termination</h3>
        <p>30 days written notice. Mercenta may suspend for breach or non-compliance.</p>
        <h3>9. Governing law</h3>
        <p>England and Wales. Exclusive jurisdiction of English courts.</p>
        <h3>10. Contact</h3>
        <p>legal@mercenta.co.uk</p>

        <h2>Platform Features</h2>
        <p>Product catalog management, Purchase order management, Shipment tracking, Compliance document management, UK customs clearance, Carrier integration (DHL, FedEx, BAK, Palletline), Contract management, Returns tracking, Sales analytics, Brand CRM, Billing and invoicing, Retail pipeline management, Marketing hub, Multi-user role access (Brand Partner, Admin, Super Admin, 3PL Carrier), Partner application/onboarding wizard, Social account management.</p>
