# §Batch-10 — Dependabot configuration
# Keeps npm dependencies, GitHub Actions, and Docker images current.

version: 2
updates:
  # npm / Node.js dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    # Group non-breaking updates together to reduce PR noise
    groups:
      production-deps:
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
      dev-deps:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci"
      - "automated"
    commit-message:
      prefix: "ci"
      include: "scope"
# §Batch-10 — GitHub Dependabot configuration
# Free, native GitHub dependency vulnerability monitoring.

version: 2
updates:
  # npm dependencies (the platform's main dependency set)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    # Group non-breaking dependency updates into single PRs
    groups:
      # React + Vite ecosystem
      react:
        patterns:
          - "react*"
          - "@types/react*"
          - "vite*"
          - "@vitejs/*"
      # Testing
      testing:
        patterns:
          - "@playwright/*"
      # TypeScript config
      typescript:
        patterns:
          - "typescript"
          - "@typescript-eslint/*"
          - "eslint*"
    ignore:
      # Major version bumps of React require manual review
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
  # GitHub Actions (used in CI workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Europe/London"
    labels:
      - "ci"
      - "dependencies"