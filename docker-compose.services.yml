# Batch B/C - Self-hosted services
# Start: docker compose -f docker-compose.services.yml up -d
# Phase D1 (2026-09-11): Rocket.Chat removed from the platform — its service
# and Mongo volume were deleted from this stack. Mercenta's communications are
# canonical (CRM / Messages / Helpdesk) and require no self-hosted chat engine.

services:
  usertour-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: usertour
      POSTGRES_USER: usertour
      POSTGRES_PASSWORD: usertour_dev_pw
    ports:
      - "5433:5432"
    volumes:
      - usertour_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usertour"]
      interval: 5s
      timeout: 5s
      retries: 5

  usertour-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  usertour:
    image: usertour/usertour:latest
    ports:
      - "8090:80"
    environment:
      DATABASE_URL: "postgres://usertour:usertour_dev_pw@usertour-db:5432/usertour?sslmode=disable"
      DATABASE_DIRECT_URL: "postgres://usertour:usertour_dev_pw@usertour-db:5432/usertour?sslmode=disable"
      Redis_HOST: usertour-redis
      Redis_PORT: "6379"
      USRTOUR_SERVER_HOST: "0.0.0.0"
      USRTOUR_SERVER_PORT: "8080"
    depends_on:
      usertour-db:
        condition: service_healthy
      usertour-redis:
        condition: service_healthy
    restart: unless-stopped

  postiz-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postiz
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: postiz_dev_pw
    ports:
      - "5434:5432"
    volumes:
      - postiz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz"]
      interval: 5s
      timeout: 5s
      retries: 5

  postiz-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    ports:
      - "8100:5000"
    environment:
      # §Phase E8 — REAL public URLs (were http://localhost:5000, which broke
      # OAuth callbacks, absolute links and the embed origin). Served with real
      # TLS by Caddy; see scripts/Caddyfile. Add a DNS A record for
      # postiz.mercenta.co.uk → this droplet to switch to the branded hostname.
      MAIN_URL: "https://46-101-75-185.sslip.io"
      FRONTEND_URL: "https://46-101-75-185.sslip.io"
      NEXT_PUBLIC_BACKEND_URL: "https://46-101-75-185.sslip.io/api"
      JWT_SECRET: "mercenta-postiz-jwt-secret-change-me"
      DATABASE_URL: "postgresql://postiz:postiz_dev_pw@postiz-db:5432/postiz-db-local"
      REDIS_URL: "redis://postiz-redis:6379"
      TEMPORAL_ADDRESS: "temporal:7233"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      IS_GENERAL: "true"
      # §Phase E8 — the ENGINE's own registration switch. Mercenta provisions
      # brand organizations server-side through the engine's supported API (it is
      # the only path the engine offers), so the flag is off — and the public
      # signup/login surface is instead blocked at OUR edge: scripts/Caddyfile
      # answers 403 for /auth* and /api/auth/* from the internet, so no brand (or
      # stranger) can register or log in directly. Only the Mercenta Social SSO
      # service, inside this network, may call those endpoints.
      DISABLE_REGISTRATION: "false"
      RUN_CRON: "true"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
    volumes:
      # §Phase E8 — engine media must outlive a container rebuild.
      - postiz_uploads:/uploads
    depends_on:
      postiz-db:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped

  # §Phase E8 — MERCENTA SOCIAL SSO + PROVISIONING SERVICE (server-side only).
  #
  # Gives an approved Mercenta brand a session in the real engine WITHOUT any
  # signup, account creation, plan choice or password handling by the brand.
  # Implementation: scripts/social-sso/server.mjs. It runs inside the engine
  # network so it can reach the engine's auth API, which Caddy blocks from the
  # internet. Secrets live in ./social-sso/.env on the server (never in git).
  social-sso:
    image: node:20-alpine
    command: ["node", "/app/server.mjs"]
    working_dir: /app
    volumes:
      - ./social-sso:/app:ro
    env_file:
      - ./social-sso/.env
    environment:
      ENGINE_INTERNAL: "http://postiz:5000"
      PORT: "8080"
    ports:
      # Bound to loopback only: Caddy (on the host) proxies /sso here.
      - "127.0.0.1:8110:8080"
    depends_on:
      postiz:
        condition: service_started
    restart: unless-stopped

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    restart: always
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data

  # §Phase E8 — Temporal is REQUIRED by the Postiz backend (it exits with
  # "connect ECONNREFUSED ::1:7233" without it, so nginx answered 502 for every
  # /api/* call). Its Elasticsearch visibility store is required too: with SQL
  # visibility the engine's own search attributes exceed the 3-Text-attribute
  # limit ("Unable to create search attributes: cannot have more than 3 search
  # attribute of type Text"), which also stops the backend from starting.
  temporal:
    container_name: temporal
    restart: always
    image: temporalio/auto-setup:1.28.1
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
      ENABLE_ES: "true"
      ES_SEEDS: temporal-elasticsearch
      ES_VERSION: v7

  # Minimal-heap Elasticsearch purely for Temporal's advanced visibility (this
  # droplet also runs the engine, two Postgres instances, Redis and the
  # orchestrator; 192 MB keeps it resident alongside a swap file).
  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    restart: always
    environment:
      ES_JAVA_OPTS: "-Xms192m -Xmx192m"
      discovery.type: single-node
      xpack.security.enabled: "false"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    expose:
      - "9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - temporal_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  usertour_pgdata:
  postiz_pgdata:
  postiz_uploads:
  temporal_postgres_data:
  temporal_elasticsearch_data:
