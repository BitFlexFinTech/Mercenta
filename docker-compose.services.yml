# Batch B/C - Self-hosted services
# Start: docker compose -f docker-compose.services.yml up -d
# Phase D1 (2026-09-11): Rocket.Chat removed from the platform — its service
# and Mongo volume were deleted from this stack. Mercenta's communications are
# §BATCH 5 (2026-10-10): Mercenta Social removed — the Postiz engine, its
# Postgres/Redis and the social-sso bridge were deleted from this stack.

services:
  usertour-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: usertour
      POSTGRES_USER: usertour
      POSTGRES_PASSWORD: usertour_dev_pw
    ports:
      - "5433:5432"
    volumes:
      - usertour_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usertour"]
      interval: 5s
      timeout: 5s
      retries: 5

  usertour-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  usertour:
    image: usertour/usertour:latest
    ports:
      - "8090:80"
    environment:
      DATABASE_URL: "postgres://usertour:usertour_dev_pw@usertour-db:5432/usertour?sslmode=disable"
      DATABASE_DIRECT_URL: "postgres://usertour:usertour_dev_pw@usertour-db:5432/usertour?sslmode=disable"
      Redis_HOST: usertour-redis
      Redis_PORT: "6379"
      USRTOUR_SERVER_HOST: "0.0.0.0"
      USRTOUR_SERVER_PORT: "8080"
    depends_on:
      usertour-db:
        condition: service_healthy
      usertour-redis:
        condition: service_healthy
    restart: unless-stopped

  # §BATCH 5 (2026-10-10) — MERCENTA SOCIAL REMOVED. The Postiz engine, its
  # Postgres/Redis pair and the `social-sso` bridge (`scripts/social-sso/server.mjs`,
  # `supabase/functions/social-session`) were deleted from the platform and from
  # this stack. `scripts/validate-retired-platforms.mjs` asserts their absence.

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    restart: always
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data

  # §BATCH 5 (2026-10-10) — REPOINTED. This stack used to justify itself by the
  # Postiz backend that required it ("connect ECONNREFUSED ::1:7233" made every
  # /api/* call answer 502). That engine has been removed, so the justification
  # above is no longer true of the current product: Temporal is retained as
  # general workflow infrastructure and NOTHING in the shipped product depends on
  # it today. Its Elasticsearch visibility store is kept for the same reason
  # (with SQL visibility, the previous engine's search attributes exceeded the
  # 3-Text-attribute limit).
  temporal:
    container_name: temporal
    restart: always
    image: temporalio/auto-setup:1.28.1
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
      ENABLE_ES: "true"
      ES_SEEDS: temporal-elasticsearch
      ES_VERSION: v7

  # Minimal-heap Elasticsearch purely for Temporal's advanced visibility (this
  # droplet also runs the engine, two Postgres instances, Redis and the
  # orchestrator; 192 MB keeps it resident alongside a swap file).
  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    restart: always
    environment:
      ES_JAVA_OPTS: "-Xms192m -Xmx192m"
      discovery.type: single-node
      xpack.security.enabled: "false"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    expose:
      - "9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - temporal_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  usertour_pgdata:
  temporal_postgres_data:
  temporal_elasticsearch_data:
